[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/store-commerce",
    "crates/permissions",
    "crates/agent-observation",
    "crates/agent-experience",
    "crates/capability-runtime",
    "crates/product-api",
    "crates/mcp-server",
    "crates/mirror",
    "crates/substrate",
    "crates/memory",
    "crates/represent",
    "crates/science",
    "crates/concept",
    "crates/capability",
    "crates/lineage",
    "crates/selfmodel",
    "crates/identity",
    "crates/intent",
    "crates/counterfactual",
    "crates/observer",
    "crates/agency",
    "crates/experiment",
    "crates/analysis",
    "crates/autonomy",
    "crates/human",
    "crates/report",
    "apps/corescout",
    "apps/mirror-tools",
    "apps/corescout-service",
    "apps/corescout-mcp",
    "apps/corescout-cli",
    "apps/corescout-demo",
    "integration",
]

# The desktop shell is a Tauri application with a dependency tree an order of
# magnitude larger than everything else here. Keeping it out of the workspace
# means `cargo test` at the root still builds and runs in seconds, which is the
# difference between gates that get run and gates that get skipped.
exclude = ["apps/corescout-desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattbusel/corescout"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
redb = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tempfile = "3"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_Security",
] }
corescout-core = { path = "crates/core" }
corescout-mirror = { path = "crates/mirror" }
corescout-substrate = { path = "crates/substrate" }
corescout-memory = { path = "crates/memory" }
corescout-represent = { path = "crates/represent" }
corescout-science = { path = "crates/science" }
corescout-concept = { path = "crates/concept" }
corescout-capability = { path = "crates/capability" }
corescout-lineage = { path = "crates/lineage" }
corescout-selfmodel = { path = "crates/selfmodel" }
corescout-identity = { path = "crates/identity" }
corescout-intent = { path = "crates/intent" }
corescout-counterfactual = { path = "crates/counterfactual" }
corescout-observer = { path = "crates/observer" }
corescout-agency = { path = "crates/agency" }
corescout-experiment = { path = "crates/experiment" }
corescout-analysis = { path = "crates/analysis" }
corescout-autonomy = { path = "crates/autonomy" }
corescout-human = { path = "crates/human" }
corescout-report = { path = "crates/report" }
corescout-storage = { path = "crates/storage" }
corescout-store-commerce = { path = "crates/store-commerce" }
corescout-permissions = { path = "crates/permissions" }
corescout-agent-observation = { path = "crates/agent-observation" }
corescout-agent-experience = { path = "crates/agent-experience" }
corescout-capability-runtime = { path = "crates/capability-runtime" }
corescout-product-api = { path = "crates/product-api" }
corescout-mcp-server = { path = "crates/mcp-server" }

[profile.release]
# The benchmark workloads in `experiment` are part of the measurement
# apparatus, so the release profile is too. Keep it deterministic.
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
