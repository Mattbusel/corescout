[package]
name = "corescout-cli"
description = "The CoreScout command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "corescout"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
corescout-core = { workspace = true }
corescout-product-api = { workspace = true }
# `run --placement` confines a child process to some of this machine's cores,
# so unlike the rest of the command line it does reach hardware.
corescout-substrate = { workspace = true }
