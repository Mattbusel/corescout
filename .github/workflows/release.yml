name: release

# Builds the installers and attaches them to a tag, with the filenames the
# download page links to.
#
# Nothing here signs anything. Signing needs a certificate this repository does
# not contain and should not; docs/WINDOWS.md says what to do when you have one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: build the installers
        shell: pwsh
        run: pwsh scripts/release.ps1

      - name: check what is about to ship
        run: cargo test -p corescout-integration --test installed -- --ignored

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Windows 10 and 11, 64-bit. Free, open source, local-first.

            These installers are not signed, so SmartScreen will warn. Check the
            SHA-256 beside each file, or build it yourself from source.
