[package]
name = "corescout-mcp-server"
description = "CoreScout as a Model Context Protocol server: the tool table and the stdio protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
corescout-product-api = { workspace = true }
rmcp = { version = "3.5", features = ["client", "transport-async-rw"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util", "rt"] }
